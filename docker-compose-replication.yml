version: '3.8'

services:
  postgres-master:
    image: bitnami/postgresql:15
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=user
      - POSTGRESQL_PASSWORD=password
      - POSTGRESQL_DATABASE=capstonev2
    ports:
      - "5432:5432" # Akses Master dari host lokal Anda di port 5432
    volumes:
      - master_data:/bitnami/postgresql
    networks:
      - db-net

  postgres-replica:
    image: bitnami/postgresql:15
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=postgres-master
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_USERNAME=user
      - POSTGRESQL_PASSWORD=password
    ports:
      - "5433:5432" # Akses Replica dari host lokal Anda di port 5433
    depends_on:
      - postgres-master
    volumes:
      - replica_data:/bitnami/postgresql
    networks:
      - db-net

networks:
  db-net:
    driver: bridge

volumes:
  master_data:
  replica_data:
