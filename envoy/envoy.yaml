admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    tcp_backlog_size: 4096 # Menambah antrean TCP di level kernel
    per_connection_buffer_limit_bytes: 32768
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: microservices_route
            virtual_hosts:
            - name: banking_services
              domains: ["*"]
              routes:
              # Route 1: /api/auth/** -> auth-service (port 9001)
              - match:
                  prefix: "/api/auth/"
                route:
                  cluster: auth_cluster

              # Route 2: /api/accounts/** -> balance-service (port 9002)
              - match:
                  prefix: "/api/accounts/"
                route:
                  cluster: balance_cluster

              # Route 3: /api/transactions/** -> transaction-service (port 9003)
              - match:
                  prefix: "/api/transactions/"
                route:
                  cluster: transaction_cluster

  clusters:
  # ===== Auth Service Cluster =====
  - name: auth_cluster
    connect_timeout: 5s # Naikkan timeout agar tidak gampang 503 saat beban berat
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    common_http_protocol_options:
      idle_timeout: 60s # Biarkan koneksi terbuka lebih lama agar tidak bolak-balik handshake
      max_requests_per_connection: 1000 # Reuse koneksi sesering mungkin
    circuit_breakers:
      thresholds:
        - priority: DEFAULT
          max_connections: 200000
          max_pending_requests: 200000
          max_requests: 200000
          max_retries: 5

    load_assignment:
      cluster_name: auth_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: auth-service
                port_value: 9001

  # ===== Balance Service Cluster =====
  - name: balance_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    common_http_protocol_options:
      idle_timeout: 60s
      max_requests_per_connection: 1000
    circuit_breakers:
      thresholds:
        - priority: DEFAULT
          max_connections: 200000
          max_pending_requests: 200000
          max_requests: 200000
    load_assignment:
      cluster_name: balance_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: balance-service
                port_value: 9002

  # ===== Transaction Service Cluster =====
  - name: transaction_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    common_http_protocol_options:
      idle_timeout: 60s
      max_requests_per_connection: 1000
    circuit_breakers:
      thresholds:
        - priority: DEFAULT
          max_connections: 200000
          max_pending_requests: 200000
          max_requests: 200000
    load_assignment:
      cluster_name: transaction_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: transaction-service
                port_value: 9003


