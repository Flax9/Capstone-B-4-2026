syntax = "proto3";

package auth;

option go_package = "capstone/proto/auth";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse) {}
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  int32 status_code = 1;
  string message = 2;
  string token = 3;
  string user_fullname = 4;
}
