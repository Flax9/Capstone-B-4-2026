version: '3.8'

# YAML anchor untuk membatasi ukuran log agar disk tidak cepat penuh
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # 📨 ZOOKEEPER + KAFKA: Message Broker untuk Async Transfer
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - data-net
    logging: *default-logging

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *default-logging

  postgres-master:
    image: bitnami/postgresql:latest
    ports:
      - "15432:5432"
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=user
      - POSTGRESQL_PASSWORD=password
      - POSTGRESQL_DATABASE=capstonev2
    networks:
      - data-net
    volumes:
      - postgres_master_data:/bitnami/postgresql
      - ./database-init:/docker-entrypoint-initdb.d
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d capstonev2"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  postgres-replica:
    image: bitnami/postgresql:latest
    ports:
      - "15433:5432"
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=postgres-master
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_USERNAME=user
      - POSTGRESQL_PASSWORD=password
    networks:
      - data-net
    depends_on:
      - postgres-master
    volumes:
      - postgres_replica_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d capstonev2"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ==========================================================
  # 🔵 PGBOUNCER: Connection Pooler di depan PostgreSQL Master
  # Mode 'transaction' membebaskan koneksi setelah setiap transaksi selesai,
  # sehingga 3 container Golang (x25 koneksi) = 75 koneksi total yang diteruskan
  # sebagai hanya ~75 koneksi stabil ke PostgreSQL Master.
  # ==========================================================
  pgbouncer-master:
    image: edoburu/pgbouncer:latest
    environment:
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=postgres-master
      - DB_PORT=5432
      - DB_NAME=capstonev2
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=5000
      - DEFAULT_POOL_SIZE=100
      - AUTH_TYPE=scram-sha-256
    networks:
      - data-net
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U user || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ==========================================================
  # 🟢 PGBOUNCER: Connection Pooler di depan PostgreSQL Replica
  # ==========================================================
  pgbouncer-replica:
    image: edoburu/pgbouncer:latest
    environment:
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=postgres-replica
      - DB_PORT=5432
      - DB_NAME=capstonev2
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=5000
      - DEFAULT_POOL_SIZE=100
      - AUTH_TYPE=scram-sha-256
    networks:
      - data-net
    depends_on:
      postgres-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U user || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ============================================================
  # 🔑 AUTH SERVICE: Layanan Autentikasi & JWT (Port 9001)
  # ============================================================
  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    environment:
      - DB_MASTER_HOST=pgbouncer-master
      - DB_MASTER_PORT=6432
      - DB_REPLICA_HOST=pgbouncer-replica
      - DB_REPLICA_PORT=6432
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    networks:
      - api-net
      - data-net
    depends_on:
      pgbouncer-master:
        condition: service_healthy
      pgbouncer-replica:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M # Naik dari 256M
    logging: *default-logging

  # ============================================================
  # ⚖️ AUDIT WORKER: Memindahkan Audit Log dari Kafka ke DB
  # ============================================================
  audit-worker:
    build:
      context: .
      dockerfile: ./audit-worker/Dockerfile
    environment:
      - DB_MASTER_HOST=pgbouncer-master
      - DB_MASTER_PORT=6432
      - KAFKA_BROKER=kafka:9092
    networks:
      - data-net
    depends_on:
      pgbouncer-master:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging: *default-logging


  # ============================================================
  # 💰 BALANCE SERVICE: Layanan Cek Saldo via Redis & Replica (Port 9002)
  # ============================================================
  balance-service:
    build:
      context: .
      dockerfile: ./balance-service/Dockerfile
    environment:
      - DB_MASTER_HOST=pgbouncer-master
      - DB_MASTER_PORT=6432
      - DB_REPLICA_HOST=pgbouncer-replica
      - DB_REPLICA_PORT=6432
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    networks:
      - api-net
      - data-net
    depends_on:
      pgbouncer-master:
        condition: service_healthy
      pgbouncer-replica:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M # Naik dari 256M
    logging: *default-logging

  # ============================================================
  # 💸 TRANSACTION SERVICE: Layanan Transfer ACID ke Master (Port 9003)
  # ============================================================
  transaction-service:
    build:
      context: .
      dockerfile: ./transaction-service/Dockerfile
    environment:
      - DB_MASTER_HOST=pgbouncer-master
      - DB_MASTER_PORT=6432
      - DB_REPLICA_HOST=pgbouncer-replica
      - DB_REPLICA_PORT=6432
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    networks:
      - api-net
      - data-net
    depends_on:
      pgbouncer-master:
        condition: service_healthy
      pgbouncer-replica:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 1G # Naik dari 512M
    logging: *default-logging

  # ============================================================
  # ⚙️ TRANSACTION WORKER: Konsumen Kafka yang Eksekusi ACID ke DB
  # Berjalan di belakang layar, tidak terekspos ke publik
  # ============================================================
  transaction-worker:
    build:
      context: .
      dockerfile: ./transaction-worker/Dockerfile
    environment:
      - DB_MASTER_HOST=pgbouncer-master
      - DB_MASTER_PORT=6432
      - DB_REPLICA_HOST=pgbouncer-replica
      - DB_REPLICA_PORT=6432
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - KAFKA_BROKER=kafka:9092
    networks:
      - data-net
    depends_on:
      pgbouncer-master:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M # Naik dari 256M
    logging: *default-logging

  haproxy:
    image: haproxy:latest
    ports:
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      api-net:
        ipv4_address: 172.25.0.100
    depends_on:
      - auth-service
      - balance-service
      - transaction-service
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - api-net
      - data-net
    depends_on:
      - auth-service
      - balance-service
      - transaction-service
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - api-net
    depends_on:
      - prometheus
    logging: *default-logging

  k6-loadtester:
    image: grafana/k6:latest
    # Profile "testing" memastikan container ini hanya jalan jika dipanggil spesifik, 
    # contoh: docker-compose --profile testing up k6-loadtester
    profiles: ["testing"]
    entrypoint: ["sh", "-c", "echo 'Menunggu jaringan stabil (5 detik)...' && sleep 5 && k6 \"$$@\"", "--"]
    volumes:
      - ./k6-scripts:/scripts
      - ./proto:/proto
    networks:
      api-net:
        ipv4_address: 172.25.0.200
    environment:
      - TARGET_HOST=172.25.0.100
    logging: *default-logging

  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
    networks:
      - api-net
    logging: *default-logging

networks:
  api-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
  data-net:
    driver: bridge

volumes:
  postgres_master_data:
  postgres_replica_data:
  redis_data:
  prometheus_data:
  grafana_data:
