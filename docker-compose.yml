version: '3.8'

# YAML anchor untuk membatasi ukuran log agar disk tidak cepat penuh
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres-master:
    image: bitnami/postgresql:latest
    ports:
      - "15432:5432"
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=user
      - POSTGRESQL_PASSWORD=password
      - POSTGRESQL_DATABASE=capstonev2
    networks:
      - data-net
    volumes:
      - postgres_master_data:/bitnami/postgresql
      - ./database-init:/docker-entrypoint-initdb.d
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d capstonev2"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  postgres-replica:
    image: bitnami/postgresql:latest
    ports:
      - "15433:5432"
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=postgres-master
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_USERNAME=user
      - POSTGRESQL_PASSWORD=password
    networks:
      - data-net
    depends_on:
      - postgres-master
    volumes:
      - postgres_replica_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d capstonev2"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment: 
      - DB_MASTER_HOST=postgres-master
      - DB_MASTER_PORT=5432
      - DB_REPLICA_HOST=postgres-replica
      - DB_REPLICA_PORT=5432
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    networks:
      - api-net
      - data-net
    depends_on:
      postgres-master:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - api-net
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - api-net
    logging: *default-logging

  k6-loadtester:
    image: grafana/k6:latest
    # Profile "testing" memastikan container ini hanya jalan jika dipanggil spesifik, 
    # contoh: docker-compose --profile testing up k6-loadtester
    profiles: ["testing"]
    volumes:
      - ./k6-scripts:/scripts
    networks:
      - api-net
    logging: *default-logging

  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
    networks:
      - api-net
    logging: *default-logging

networks:
  api-net:
    driver: bridge
  data-net:
    driver: bridge

volumes:
  postgres_master_data:
  postgres_replica_data:
  redis_data:
  prometheus_data:
  grafana_data:
